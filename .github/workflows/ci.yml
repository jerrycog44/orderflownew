name: OrderFlow CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Oxlint)
        run: npm run lint

      - name: TypeScript Strict Verification
        run: npm run typecheck

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Bundle Build
        run: npm run build
