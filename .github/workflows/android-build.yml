name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          (yes || true) | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager --channel=3 --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Build Android APKs with Gradle
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK (Installable)
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: orderflow-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
