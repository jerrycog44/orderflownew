name: Deploy Rider Hunter Function

on:
  push:
    branches:
      - feature/orderflow-rider-hunter-phase-4-agents
    paths:
      - supabase/functions/rider-hunter-discover/**

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy discovery function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy rider-hunter-discover \
            --project-ref "$SUPABASE_PROJECT_REF"
